    function createElement(tag, classes, textContent, attributes = {}) {
        const element = document.createElement(tag);
        if (classes) element.className = classes;
        if (textContent) element.innerHTML = textContent;
        for (const key in attributes) {
            element.setAttribute(key, attributes[key]);
        }
        return element;
    }

    function createStatusBadge(statusKey, statusMap) {
        const statusInfo = statusMap[statusKey] || { text: "Indefinido", classes: "bg-gray-100 text-gray-800 border border-gray-200" };
        return createElement('span', `inline-block font-semibold rounded-full whitespace-nowrap px-3 py-1 text-xs ${statusInfo.classes}`, statusInfo.text);
    }

    function calculateDays(endDateStr) {
        if (!endDateStr) return '';
        const parts = endDateStr.split('/');
        if (parts.length !== 3) return '';
        const [day, month, year] = parts;
        const endDate = new Date(parseInt(year, 10), parseInt(month, 10) - 1, parseInt(day, 10), 23, 59, 59, 999);
        const now = new Date();
        const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const diffTime = endDate - startOfToday;
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

        if (diffDays > 1) { return `<span class="font-bold text-green-600">${diffDays} dias restantes</span>`; } 
        else if (diffDays === 1 || diffDays === 0) { return `<span class="font-bold text-orange-500">Último dia</span>`; } 
        else { return `<span class="text-gray-500 font-semibold">Encerrada</span>`; }
    }
    
    function isConsultaAberta(startDateStr, endDateStr) {
        if (!startDateStr || !endDateStr) return false;
        const startParts = startDateStr.split('/');
        const endParts = endDateStr.split('/');
        if (startParts.length !== 3 || endParts.length !== 3) return false;
        const [startDay, startMonth, startYear] = startParts;
        const [endDay, endMonth, endYear] = endParts;
        const startDate = new Date(parseInt(startYear, 10), parseInt(startMonth, 10) - 1, parseInt(startDay, 10), 0, 0, 0, 0);
        const endDate = new Date(parseInt(endYear, 10), parseInt(endMonth, 10) - 1, parseInt(endDay, 10), 23, 59, 59, 999);
        const now = new Date();
        return now >= startDate && now <= endDate;
    }

    const agendaRegulatoriaThemes = [
        { title: "1. Novos modelos de negócio e inovação tecnológica", description: "O setor elétrico passa por transformações impulsionadas por novas tecnologias, compromissos de descarbonização e maior participação dos consumidores. A ANEEL busca eliminar barreiras regulatórias para fomentar um desenvolvimento de mercado equilibrado e garantir a modicidade tarifária." },
        { title: "2. Mercado de energia elétrica", description: "Com a abertura do mercado livre para todos os consumidores de alta tensão e a futura inclusão da baixa tensão, a ANEEL foca em aprimorar a regulação para assegurar a sustentabilidade do setor, a segurança do suprimento e a proteção dos consumidores, tratando de temas como migração, alocação de custos e modernização das regras de comercialização." },
        { title: "3. Operação e preço de curto prazo", description: "Este tema visa o aprimoramento contínuo dos modelos computacionais de otimização (NEWAVE, DECOMP) e de formação de preço (PLD), incorporando novas tecnologias como usinas híbridas e sistemas de armazenamento para refletir a complexidade crescente do sistema elétrico." },
        { title: "4. Contabilidade do setor elétrico", description: "Propõe-se a revisão e modernização dos manuais de contabilidade do setor elétrico para aumentar a transparência, a padronização e a comparabilidade das informações financeiras dos agentes, refletindo as novas dinâmicas do mercado." },
        { title: "5. Regulação de operações econômico-financeiras", description: "A ANEEL busca fortalecer o monitoramento da saúde financeira dos agentes, especialmente em um cenário de mercado mais aberto. O foco está na adequação de garantias financeiras e na gestão de riscos para garantir a liquidez e a segurança das operações." },
        { title: "6. Modernização da regulação econômica e das tarifas", description: "Este eixo trata da revisão das metodologias tarifárias de transmissão e distribuição, buscando maior eficiência, incentivos à qualidade e uma alocação de custos que considere novas tecnologias, como redes inteligentes e armazenamento de energia." },
        { title: "7. Novos contratos de concessão de transmissão e distribuição", description: "A agência se prepara para futuras licitações de concessão, desenvolvendo contratos que incentivem a modernização, a resiliência das redes e a melhoria contínua da qualidade dos serviços prestados à população." },
        { title: "8. Acesso e atendimento de usuários e consumidores", description: "O objetivo é simplificar as regras de acesso às redes, principalmente para a geração distribuída, e aprimorar os canais de atendimento e os mecanismos de proteção ao consumidor, garantindo um relacionamento mais justo e transparente." },

    function renderPageWithAnimation(renderFunction, container) {
        window.scrollTo(0, 0); 
        container.classList.remove('content-area');
        void container.offsetWidth; 
        container.classList.add('content-area');
        renderFunction(container);

    function renderGenericPautaPage(container, agendaData, title, date, youtubeLink, pautaLink, pageNote = null, sourceLabel = 'Ver Pauta em PDF') {
        container.innerHTML = '';

        const pageTitle = createElement('h1', 'page-title text-2xl sm:text-3xl font-bold mb-1', title);
        const pageDate = createElement('p', 'text-gray-600 text-base mb-6', `Data da Reunião: ${date}`);
        container.appendChild(pageTitle);
        container.appendChild(pageDate);

        const sourceNote = createElement('div', 'bg-blue-50 border border-blue-200 text-blue-900 p-4 rounded-xl mb-6 text-sm leading-relaxed');
        sourceNote.innerHTML = pageNote || `<strong>Nota sobre os resumos:</strong> sínteses informativas consolidadas a partir da pauta/ata oficial e de registros públicos da reunião. O vídeo integral está vinculado para conferência e os resumos não substituem os votos, atos ou a ata definitiva.`;
        container.appendChild(sourceNote);

        // Aviso / Link da Reunião
        const reuniaoSection = createElement('div', 'bg-i4-dark-gray text-white p-5 rounded-xl flex flex-col md:flex-row items-center justify-between gap-4 mb-6');
        const avisoText = createElement('div', '');
        avisoText.innerHTML = `<p class="font-bold text-lg mb-1">Consulte a deliberação</p><p class="text-sm text-gray-300">Acesse a pauta assinada e os documentos oficiais disponibilizados pela ANEEL.</p>`;
        
        const buttonsDiv = createElement('div', 'flex flex-wrap gap-3 justify-center md:justify-end');
        if(pautaLink){
            const linkAnchor = createElement('a', 'bg-white text-i4-dark-gray hover:bg-gray-100 font-bold py-2.5 px-5 rounded-lg transition-colors duration-300 flex items-center shadow-md text-sm whitespace-nowrap', `${icons.file} ${sourceLabel}`, { href: pautaLink, target: '_blank', rel: 'noopener noreferrer' });
            buttonsDiv.appendChild(linkAnchor);
        }
        if(youtubeLink){
            const videos = Array.isArray(youtubeLink) ? youtubeLink : [{ url: youtubeLink, title: 'Assistir no YouTube' }];
            videos.forEach(video => {
                const videoAnchor = createElement('a', 'bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 px-5 rounded-lg transition-colors duration-300 flex items-center shadow-md text-sm whitespace-nowrap', `${icons.video} ${video.title}`, { href: video.url, target: '_blank', rel: 'noopener noreferrer' });
                buttonsDiv.appendChild(videoAnchor);
            });
        }
        
        reuniaoSection.appendChild(avisoText);
        reuniaoSection.appendChild(buttonsDiv);
        container.appendChild(reuniaoSection);

        // Sumário
        const summaryDiv = createElement('div', 'info-card mb-10');
        const summaryHeader = createElement('div', 'card-header p-5');
        summaryHeader.appendChild(createElement('h2', 'text-xl font-bold text-i4-dark-gray', title.startsWith('Resultados da 20ª') ? 'Sumário dos Resultados' : 'Sumário da Pauta'));
        summaryDiv.appendChild(summaryHeader);

        const summaryList = createElement('ul', 'space-y-1 p-3');
        
        const getSummarySubject = (item) => {
            if (!item || !item.subject) return "";
            if (item.summaryTitle) return item.summaryTitle;
            
            // Lógica unificada para resumos baseados no número do item
            switch (item.originalItemNumber) {
                case 3: return "RTP 2026 da Neoenergia Distribuição Brasília";
                case 4: return "CP 45/2019 – Critérios para redução ou limitação de geração";
                case 6: return "Decreto 12.772/2025 – Regras dos Serviços de Transmissão";
                case 11: return "Reajuste Tarifário Anual da EDP Espírito Santo";
                case 17: return "Axia Energia Sul – Melhorias de Grande Porte e RAP";
                case 38: return "Axia/Chesf – Reanálise de reforços de transmissão";
                case 42: return "Ratificação – Cobertura tarifária integral da RAP";
                default: return item.subject.length > 70 ? item.subject.substring(0, 70) + '...' : item.subject;
            }
        };

        const sortedAgenda = [...agendaData].sort((a, b) => a.originalItemNumber - b.originalItemNumber);

        sortedAgenda.forEach(item => {
            const listItem = createElement('li', 'flex flex-col sm:flex-row sm:items-center justify-between gap-2 p-3 rounded-lg hover:bg-i4-light-gray');
            const itemLink = createElement('a', 'text-i4-text-gray hover:text-i4-blue flex-grow min-w-0', null, { href: `#item-${item.originalItemNumber}` });
            itemLink.innerHTML = `<span class="font-bold mr-2 text-i4-dark-gray">Item ${item.originalItemNumber}:</span><span>${getSummarySubject(item)}</span>`;
            
            const statusBadge = createStatusBadge(item.status, pautaStatusMap);
            statusBadge.classList.add('mt-2', 'sm:mt-0', 'flex-shrink-0');

            listItem.appendChild(itemLink);
            listItem.appendChild(statusBadge);
            summaryList.appendChild(listItem);
        });
        summaryDiv.appendChild(summaryList);
        container.appendChild(summaryDiv);

        // Grid de Itens
        const agendaGrid = createElement('div', 'space-y-8');
        sortedAgenda.forEach(item => {
            const itemDiv = createElement('div', 'info-card', null, { id: `item-${item.originalItemNumber}` });
            const cardHeader = createElement('div', 'card-header p-5 flex justify-between items-center flex-wrap gap-2');
            const h3Subject = createElement('h3', 'text-lg font-semibold text-i4-dark-gray');
            
            const blockText = item.isBloco ? ` <span class="font-bold text-red-600">(${item.blockLabel || 'Bloco'})</span>` : '';
            h3Subject.innerHTML = `Item ${item.originalItemNumber}${blockText} <span class="font-normal text-i4-text-gray">| Processo: ${item.process}</span>`;
            
            cardHeader.appendChild(h3Subject);
            cardHeader.appendChild(createStatusBadge(item.status, pautaStatusMap));
            itemDiv.appendChild(cardHeader);

            const cardBody = createElement('div', 'p-6 space-y-5');
            const infoContainer = createElement('div', 'space-y-4');

            const createInfoRow = (icon, label, value) => {
                 if (!value || value === "-") return document.createDocumentFragment();
                 const row = createElement('div', 'flex flex-col md:flex-row');
                 const labelDiv = createElement('div', 'flex-shrink-0 w-full md:w-48 flex items-center text-sm font-semibold text-i4-text-gray mb-1 md:mb-0');
                 labelDiv.innerHTML = icon + label;
                 const valueDiv = createElement('div', 'text-sm text-i4-dark-gray flex-1 leading-relaxed');
                 valueDiv.innerHTML = value;
                 row.appendChild(labelDiv);
                 row.appendChild(valueDiv);
                 return row;
             };

            infoContainer.appendChild(createInfoRow(icons.clipboard, 'Assunto', item.subject));
            infoContainer.appendChild(createInfoRow(icons.user, 'Relator(a)', item.relator));
            infoContainer.appendChild(createInfoRow(icons.building, 'Área Responsável', item.areaResponsible));

            if (item.decision) {
                infoContainer.appendChild(createInfoRow(icons.gavel, 'Decisão', `<span class="font-semibold text-i4-dark-gray">${item.decision}</span>`));
            }
             if (item.details) {
                infoContainer.appendChild(createInfoRow(icons.info, 'Detalhes oficiais', item.details));
            }
            if (item.discussionSummary) {
                infoContainer.appendChild(createInfoRow(icons.gavel, 'Resumo da discussão', item.discussionSummary));
            }
            if (item.oralSummary) {
                infoContainer.appendChild(createInfoRow(icons.user, 'Sustentação oral', item.oralSummary));
            }

            cardBody.appendChild(infoContainer);

            if (item.links && item.links.length > 0) {
                 const separator = createElement('hr', 'border-t border-i4-border-gray my-5');
                 cardBody.appendChild(separator);
                 
                 const cardFooter = createElement('div', 'flex flex-wrap gap-x-6 gap-y-2 items-center');
                 item.links.forEach(link => {
                     const linkIcon = link.isVideo ? icons.video : icons.link;

                     cardFooter.appendChild(linkAnchor);

    function renderConsultasPage(container) {

        updateNote.innerHTML = `<strong>Atualização: 08/10/2026.</strong> Incluídas as CPs 036 e 037/2026 da ANEEL e as consultas do MME sobre PDE 2036, metas de gás natural/biometano (CP 234/2026) e PLANGEO – Geofísica (MME/SGB). As 14 tomadas de subsídios sobre DEC/FEC e a AP 007/2026 foram conferidas em notícias oficiais; os dados da CP 231/2026 (Luz para Todos) foram corrigidos conforme o registro do MME. A verificação integral das listagens de participação social da ANEEL e do MME permanece pendente; os demais registros mantêm as datas da versão anterior. Confira eventuais prorrogações nas fontes indicadas.`;
        container.appendChild(updateNote);

        const tableContainer = createElement('div', 'info-card overflow-x-auto');

        consultasPublicasData.forEach(cp => {
            if ((cp.numero || '').startsWith('AP ')) {
                const parts = cp.fim.split('/');
                const eventDate = new Date(parseInt(parts[2], 10), parseInt(parts[1], 10) - 1, parseInt(parts[0], 10), 23, 59, 59, 999);
                cp.status = new Date() <= eventDate ? 'aberta' : 'encerrada';
            } else {
                cp.status = isConsultaAberta(cp.inicio, cp.fim) ? 'aberta' : 'encerrada';
            }
        });

        const parseDate = (dateStr) => {
            const parts = dateStr.split('/');
            return new Date(parseInt(parts[2], 10), parseInt(parts[1], 10) - 1, parseInt(parts[0], 10), 23, 59, 59, 999);
        };

        const openConsultas = consultasPublicasData.filter(cp => cp.status === 'aberta').sort((a, b) => parseDate(a.fim) - parseDate(b.fim));

        // Mobile
        const mobileContainer = createElement('div', 'md:hidden divide-y divide-i4-border-gray');
        if (openConsultas.length === 0) {
            mobileContainer.innerHTML = `<div class="p-6 text-center text-i4-text-gray">Nenhuma consulta aberta no momento.</div>`;
        } else {
            openConsultas.forEach(cp => {
                const card = createElement('div', 'p-6 space-y-3');
                card.innerHTML = `
                    <div class="flex justify-between items-start gap-4">

                        <div class="flex-shrink-0">${createStatusBadge(cp.status, consultaStatusMap).outerHTML}</div>
                    </div>
                    <div class="text-i4-dark-gray leading-relaxed">${cp.tema}</div>
                    <div class="text-sm text-i4-text-gray space-y-1">
                        <p><strong>Período:</strong> ${cp.inicio} a ${cp.fim}</p>
                        <p><strong>Prazo:</strong> ${calculateDays(cp.fim)}</p>
                        <p><strong>Área:</strong> ${cp.area}</p>
                    </div>
                    <a href="${cp.link}" target="_blank" rel="noopener noreferrer" class="group inline-flex items-center text-i4-blue hover:text-blue-700 font-semibold mt-2">Acessar Detalhes ${icons.arrowRight}</a>
                `;
                mobileContainer.appendChild(card);
            });
        }
        tableContainer.appendChild(mobileContainer);

        // Desktop
        const table = createElement('table', 'styled-table w-full text-sm text-left text-i4-text-gray hidden md:table');
        table.innerHTML = `
            <thead class="text-xs text-i4-text-gray uppercase bg-i4-light-gray">
                <tr>
                    <th scope="col" class="px-6 py-4">Número</th>
                    <th scope="col" class="px-6 py-4">Origem</th>
                    <th scope="col" class="px-6 py-4 min-w-[300px]">Tema</th>
                    <th scope="col" class="px-6 py-4 text-center">Status</th>
                    <th scope="col" class="px-6 py-4">Período</th>
                    <th scope="col" class="px-6 py-4 text-center">Prazo</th>
                    <th scope="col" class="px-6 py-4">Área</th>
                    <th scope="col" class="px-6 py-4 text-center">Acesso</th>
                </tr>
            </thead>
        `;
        const tbody = createElement('tbody', 'bg-white divide-y divide-i4-border-gray');
        if (openConsultas.length === 0) {
            tbody.innerHTML = `<tr><td colspan="8" class="px-6 py-4 text-center text-i4-text-gray">Nenhuma consulta aberta no momento.</td></tr>`;
        } else {
            openConsultas.forEach(cp => {
                const tr = createElement('tr', 'hover:bg-i4-light-gray');
                tr.innerHTML = `
                    <td class="px-6 py-4 font-bold text-gray-900 whitespace-nowrap">${cp.numero}</td>
                    <td class="px-6 py-4">${cp.origem || 'ANEEL'}</td>
                    <td class="px-6 py-4 text-justify">${cp.tema}</td>

                    <td class="px-6 py-4">${cp.area}</td>

                `;
                tr.children[3].appendChild(createStatusBadge(cp.status, consultaStatusMap));
                tr.children[5].innerHTML = calculateDays(cp.fim);
                tbody.appendChild(tr);
            });

    function renderRegulatoryTable(container, data, title, hasYearColumn = false) {
        const tableTitle = createElement('h3', 'text-xl font-bold text-i4-dark-gray mb-4 mt-8', title);
        container.appendChild(tableTitle);

        const tableContainer = createElement('div', 'info-card overflow-x-auto mb-10');
        const table = createElement('table', 'styled-table w-full text-sm text-left text-i4-text-gray');
        const thead = createElement('thead', 'text-xs text-i4-text-gray uppercase bg-i4-light-gray');
        const tbody = createElement('tbody', 'bg-white divide-y divide-i4-border-gray');

        let headerHtml = `
            <tr>
                <th scope="col" class="w-20 px-6 py-4">Eixo Temático</th>
                <th scope="col" class="w-20 px-6 py-4">Código</th>
        `;
        if (hasYearColumn) {
            headerHtml += `<th scope="col" class="w-32 px-6 py-4 text-center">Ano Previsto</th>`;
        }
        headerHtml += `<th scope="col" class="px-6 py-4">Atividade Regulatória</th></tr>`;
        thead.innerHTML = headerHtml;
        table.appendChild(thead);

        let currentEixo = null;
        data.forEach(item => {
            const tr = createElement('tr', 'hover:bg-i4-light-gray');
            
            let eixoCell = '';
            if (item.eixo !== currentEixo) {
                const rowSpanCount = data.filter(d => d.eixo === item.eixo).length;
                eixoCell = `<td class="px-6 py-4 font-semibold text-i4-blue align-middle border-r border-i4-border-gray" rowspan="${rowSpanCount}">${item.eixo}</td>`;
                currentEixo = item.eixo;
            }

            let yearCell = hasYearColumn ? `<td class="px-6 py-4 whitespace-nowrap font-medium text-i4-dark-gray text-center">${item.ano || '-'}</td>` : '';
            
            tr.innerHTML = `
                ${eixoCell}
                <td class="px-6 py-4 font-semibold text-i4-dark-gray">${item.codigo}</td>
                ${yearCell}
                <td class="px-6 py-4">${item.atividade}</td>
            `;
            tbody.appendChild(tr);
        });

        table.appendChild(tbody);
        tableContainer.appendChild(table);
        container.appendChild(tableContainer);
    }

    function renderApp() {
      const appContainer = document.getElementById('app-container');
      
      const header = createElement('header', 'bg-white shadow-md p-5 sticky top-0 z-20');
      const headerContent = createElement('div', 'container mx-auto flex flex-col md:flex-row items-center justify-between gap-4');
      const logoImg = createElement('img', 'h-12 w-auto', null, { src: i4LogoUrl, alt: 'i4 Logo', onerror: "this.style.display='none';" });
      headerContent.appendChild(logoImg);

      const navContainer = createElement('div', 'flex flex-wrap gap-2 justify-center md:justify-start');
      
      const pauta20RPOButton = createElement('button', 'nav-button-base nav-button-inactive', '20ª RPO');
      const pauta18CDPOButton = createElement('button', 'nav-button-base nav-button-inactive', '18º Circuito');
      const consultasButton = createElement('button', 'nav-button-base nav-button-inactive', 'Consultas e Subsídios');
      const agendaButton = createElement('button', 'nav-button-base nav-button-inactive', 'Agenda Regulatória');
      const imersaoButton = createElement('button', 'nav-button-base nav-button-inactive', 'Imersões 2026');

      navContainer.append(pauta20RPOButton, pauta18CDPOButton, consultasButton, agendaButton, imersaoButton);
      headerContent.appendChild(navContainer);
      header.appendChild(headerContent);
      appContainer.appendChild(header);
      
      const main = createElement('main', 'container mx-auto p-6 md:p-10');
      const contentContainer = createElement('div', 'mt-4');
      main.appendChild(contentContainer);
      appContainer.appendChild(main);

      const footer = createElement('footer', 'text-center mt-12 p-8 text-gray-500 text-sm border-t border-gray-200');
      footer.innerHTML = `© 2026 i4 Economic Regulation. Todos os direitos reservados.`;
      appContainer.appendChild(footer);

      const buttons = [pauta20RPOButton, pauta18CDPOButton, consultasButton, agendaButton, imersaoButton];
      function setActiveButton(activeBtn) {
          buttons.forEach(btn => { btn.classList.remove('nav-button-active'); btn.classList.add('nav-button-inactive'); });
          activeBtn.classList.add('nav-button-active'); activeBtn.classList.remove('nav-button-inactive');
      }

      pauta20RPOButton.addEventListener('click', () => { setActiveButton(pauta20RPOButton); renderPageWithAnimation(renderPauta20RPOPage, contentContainer); });
      pauta18CDPOButton.addEventListener('click', () => { setActiveButton(pauta18CDPOButton); renderPageWithAnimation(renderPauta18CDPOPage, contentContainer); });
      consultasButton.addEventListener('click', () => { setActiveButton(consultasButton); renderPageWithAnimation(renderConsultasPage, contentContainer); });
      agendaButton.addEventListener('click', () => { setActiveButton(agendaButton); renderPageWithAnimation(renderAgendaRegulatoriaPage, contentContainer); });
      imersaoButton.addEventListener('click', () => { setActiveButton(imersaoButton); renderPageWithAnimation(renderImersaoPage, contentContainer); });

      // Inicia na aba da 20ª RPO, por ser a pauta mais recente
      setActiveButton(pauta20RPOButton);
      renderPageWithAnimation(renderPauta20RPOPage, contentContainer);
    }

    // Inicialização final do app
    document.addEventListener('DOMContentLoaded', renderApp);
  </script>
