<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard ANEEL 2026 - i4 Economic Regulation</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Configuração de Cores Tailwind Personalizadas i4 -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'i4-blue': '#167AB0',
            'i4-dark-gray': '#2d3748',
            'i4-light-gray': '#f7fafc',
            'i4-border-gray': '#e2e8f0',
            'i4-text-gray': '#4a5568',
          }
        }
      }
    }
  </script>
  
  <style>
    /* Estilos globais */
    body {
      font-family: "Inter", sans-serif;
      background-color: #f7fafc; 
      color: #2d3748; 
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    html {
      scroll-behavior: smooth;
    }
    
    /* Estilo base do botão de navegação */
    .nav-button-base {
        padding-left: 1.25rem; 
        padding-right: 1.25rem; 
        padding-top: 0.625rem; 
        padding-bottom: 0.625rem; 
        font-size: 0.875rem; 
        line-height: 1.25rem;
        font-weight: 500; 
        border-radius: 0.5rem; 
        transition: background-color 0.2s, color 0.2s, box-shadow 0.2s;
        cursor: pointer;
        white-space: nowrap; 
    }
    .nav-button-active {
        background-color: #167AB0; 
        color: white;
        font-weight: 600;
        box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
    }
    .nav-button-inactive {
        background-color: #e2e8f0; 
        color: #4a5568; 
    }
    .nav-button-inactive:hover {
        background-color: #cbd5e0; 
        color: #2d3748; 
        box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
    }

    /* Animação de Fade-in */
    .content-area {
      animation: fadeIn 0.5s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Cards e Tabelas */
    .info-card {
        background-color: white;
        border-radius: 0.75rem;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.04);
        border: 1px solid #e2e8f0;
        overflow: hidden;
    }
    .card-header { background-color: #f7fafc; border-bottom: 1px solid #e2e8f0; }
    .card-footer { background-color: #f7fafc; border-top: 1px solid #e2e8f0; }
    
    .styled-table thead th {
        background-color: #edf2f7; color: #4a5568; font-weight: 600;
        text-transform: uppercase; letter-spacing: 0.05em;
    }
    .styled-table tbody tr:hover { background-color: #f7fafc; }
    .styled-table td, .styled-table th { padding: 1rem 1.5rem; vertical-align: top; }
    .styled-table tbody tr { border-bottom: 1px solid #e2e8f0; }
    .styled-table tbody tr:last-child { border-bottom: none; }

    .page-title {
        color: #167AB0;
        border-bottom: 2px solid #e2e8f0;
        padding-bottom: 0.75rem;
        margin-bottom: 2rem;
    }

    /* Cabeçalho com logo incorporada e navegação alinhada à direita. */
    .dashboard-header-inner {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      width: 100%;
    }
    .dashboard-logo {
      display: block;
      flex: 0 0 auto;
      height: 48px;
      width: auto;
      object-fit: contain;
    }
    .dashboard-nav {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 0.5rem;
      margin-left: auto;
      min-width: 0;
    }
    @media (max-width: 767px) {
      .dashboard-header-inner {
        flex-direction: column;
      }
      .dashboard-nav {
        width: 100%;
        margin-left: 0;
        justify-content: center;
      }
    }
  </style>
</head>

  <script>
    function createElement(tag, classes, textContent, attributes = {}) {
        const element = document.createElement(tag);
        if (classes) element.className = classes;
        if (textContent) element.innerHTML = textContent;
        for (const key in attributes) {
            element.setAttribute(key, attributes[key]);
        }
        return element;
    }

    function createStatusBadge(statusKey, statusMap) {
        const statusInfo = statusMap[statusKey] || { text: "Indefinido", classes: "bg-gray-100 text-gray-800 border border-gray-200" };
        return createElement('span', `inline-block font-semibold rounded-full whitespace-nowrap px-3 py-1 text-xs ${statusInfo.classes}`, statusInfo.text);
    }

    function calculateDays(endDateStr) {
        if (!endDateStr) return '';
        const parts = endDateStr.split('/');
        if (parts.length !== 3) return '';
        const [day, month, year] = parts;
        const endDate = new Date(parseInt(year, 10), parseInt(month, 10) - 1, parseInt(day, 10), 23, 59, 59, 999);
        const now = new Date();
        const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const diffTime = endDate - startOfToday;
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

        if (diffDays > 1) { return `<span class="font-bold text-green-600">${diffDays} dias restantes</span>`; } 
        else if (diffDays === 1 || diffDays === 0) { return `<span class="font-bold text-orange-500">Último dia</span>`; } 
        else { return `<span class="text-gray-500 font-semibold">Encerrada</span>`; }
    }
    
    function isConsultaAberta(startDateStr, endDateStr) {
        if (!startDateStr || !endDateStr) return false;
        const startParts = startDateStr.split('/');
        const endParts = endDateStr.split('/');
        if (startParts.length !== 3 || endParts.length !== 3) return false;
        const [startDay, startMonth, startYear] = startParts;
        const [endDay, endMonth, endYear] = endParts;
        const startDate = new Date(parseInt(startYear, 10), parseInt(startMonth, 10) - 1, parseInt(startDay, 10), 0, 0, 0, 0);
        const endDate = new Date(parseInt(endYear, 10), parseInt(endMonth, 10) - 1, parseInt(endDay, 10), 23, 59, 59, 999);
        const now = new Date();
        return now >= startDate && now <= endDate;
    }

    function renderPageWithAnimation(renderFunction, container) {
        window.scrollTo(0, 0); 
        container.classList.remove('content-area');
        void container.offsetWidth; 
        container.classList.add('content-area');
        renderFunction(container);

    function renderGenericPautaPage(container, agendaData, title, date, youtubeLink, pautaLink, pageNote = null, sourceLabel = 'Ver Pauta em PDF') {
        container.innerHTML = '';

        const pageTitle = createElement('h1', 'page-title text-2xl sm:text-3xl font-bold mb-1', title);
        const pageDate = createElement('p', 'text-gray-600 text-base mb-6', `Data da Reunião: ${date}`);
        container.appendChild(pageTitle);
        container.appendChild(pageDate);

        const sourceNote = createElement('div', 'bg-blue-50 border border-blue-200 text-blue-900 p-4 rounded-xl mb-6 text-sm leading-relaxed');
        sourceNote.innerHTML = pageNote || `<strong>Nota sobre os resumos:</strong> sínteses informativas consolidadas a partir da pauta/ata oficial e de registros públicos da reunião. O vídeo integral está vinculado para conferência e os resumos não substituem os votos, atos ou a ata definitiva.`;
        container.appendChild(sourceNote);

        // Aviso / Link da Reunião
        const reuniaoSection = createElement('div', 'bg-i4-dark-gray text-white p-5 rounded-xl flex flex-col md:flex-row items-center justify-between gap-4 mb-6');
        const avisoText = createElement('div', '');
        avisoText.innerHTML = `<p class="font-bold text-lg mb-1">${title.startsWith('Resultados') ? 'Consulte a deliberação' : 'Consulte a pauta'}</p><p class="text-sm text-gray-300">Acesse a pauta e os documentos oficiais disponibilizados pela ANEEL.</p>`;
        
        const buttonsDiv = createElement('div', 'flex flex-wrap gap-3 justify-center md:justify-end');
        if(pautaLink){
            const linkAnchor = createElement('a', 'bg-white text-i4-dark-gray hover:bg-gray-100 font-bold py-2.5 px-5 rounded-lg transition-colors duration-300 flex items-center shadow-md text-sm whitespace-nowrap', `${icons.file} ${sourceLabel}`, { href: pautaLink, target: '_blank', rel: 'noopener noreferrer' });
            buttonsDiv.appendChild(linkAnchor);
        }
        if(youtubeLink){
            const videos = Array.isArray(youtubeLink) ? youtubeLink : [{ url: youtubeLink, title: 'Assistir no YouTube' }];
            videos.forEach(video => {
                const videoAnchor = createElement('a', 'bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 px-5 rounded-lg transition-colors duration-300 flex items-center shadow-md text-sm whitespace-nowrap', `${icons.video} ${video.title}`, { href: video.url, target: '_blank', rel: 'noopener noreferrer' });
                buttonsDiv.appendChild(videoAnchor);
            });
        }
        
        reuniaoSection.appendChild(avisoText);
        reuniaoSection.appendChild(buttonsDiv);
        container.appendChild(reuniaoSection);

        // Sumário
        const summaryDiv = createElement('div', 'info-card mb-10');
        const summaryHeader = createElement('div', 'card-header p-5');
        summaryHeader.appendChild(createElement('h2', 'text-xl font-bold text-i4-dark-gray', title.startsWith('Resultados') ? 'Sumário dos Resultados' : 'Sumário da Pauta'));
        summaryDiv.appendChild(summaryHeader);

        const summaryList = createElement('ul', 'space-y-1 p-3');
        
        const getSummarySubject = (item) => {
            if (!item || !item.subject) return "";
            if (item.summaryTitle) return item.summaryTitle;
            
            // Lógica unificada para resumos baseados no número do item
            switch (item.originalItemNumber) {
                case 3: return "RTP 2026 da Neoenergia Distribuição Brasília";
                case 4: return "CP 45/2019 – Critérios para redução ou limitação de geração";
                case 6: return "Decreto 12.772/2025 – Regras dos Serviços de Transmissão";
                case 11: return "Reajuste Tarifário Anual da EDP Espírito Santo";
                case 17: return "Axia Energia Sul – Melhorias de Grande Porte e RAP";
                case 38: return "Axia/Chesf – Reanálise de reforços de transmissão";
                case 42: return "Ratificação – Cobertura tarifária integral da RAP";
                default: return item.subject.length > 70 ? item.subject.substring(0, 70) + '...' : item.subject;
            }
        };

        const sortedAgenda = [...agendaData].sort((a, b) => a.originalItemNumber - b.originalItemNumber);

        sortedAgenda.forEach(item => {
            const listItem = createElement('li', 'flex flex-col sm:flex-row sm:items-center justify-between gap-2 p-3 rounded-lg hover:bg-i4-light-gray');
            const itemLink = createElement('a', 'text-i4-text-gray hover:text-i4-blue flex-grow min-w-0', null, { href: `#item-${item.originalItemNumber}` });
            itemLink.innerHTML = `<span class="font-bold mr-2 text-i4-dark-gray">Item ${item.originalItemNumber}:</span><span>${getSummarySubject(item)}</span>`;
            
            const statusBadge = createStatusBadge(item.status, pautaStatusMap);
            statusBadge.classList.add('mt-2', 'sm:mt-0', 'flex-shrink-0');

            listItem.appendChild(itemLink);
            listItem.appendChild(statusBadge);
            summaryList.appendChild(listItem);
        });
        summaryDiv.appendChild(summaryList);
        container.appendChild(summaryDiv);

        // Grid de Itens
        const agendaGrid = createElement('div', 'space-y-8');
        sortedAgenda.forEach(item => {

                 const labelDiv = createElement('div', 'flex-shrink-0 w-full md:w-48 flex items-center text-sm font-semibold text-i4-text-gray mb-1 md:mb-0');

                 valueDiv.innerHTML = value;
                 row.appendChild(labelDiv);
                 row.appendChild(valueDiv);
                 return row;
             };

            infoContainer.appendChild(createInfoRow(icons.clipboard, 'Assunto', item.subject));
            infoContainer.appendChild(createInfoRow(icons.user, 'Relator(a)', item.relator));
            infoContainer.appendChild(createInfoRow(icons.building, 'Área Responsável', item.areaResponsible));

            if (item.decision) {
                infoContainer.appendChild(createInfoRow(icons.gavel, 'Decisão', `<span class="font-semibold text-i4-dark-gray">${item.decision}</span>`));
            }
             if (item.details) {
                infoContainer.appendChild(createInfoRow(icons.info, 'Detalhes oficiais', item.details));
            }
            if (item.discussionSummary) {
                infoContainer.appendChild(createInfoRow(icons.gavel, 'Resumo da discussão', item.discussionSummary));
            }
            if (item.oralSummary) {
                infoContainer.appendChild(createInfoRow(icons.user, 'Sustentação oral', item.oralSummary));
            }

            cardBody.appendChild(infoContainer);

            if (item.links && item.links.length > 0) {
                 const separator = createElement('hr', 'border-t border-i4-border-gray my-5');
                 cardBody.appendChild(separator);
                 
                 const cardFooter = createElement('div', 'flex flex-wrap gap-x-6 gap-y-2 items-center');

                     const linkIcon = link.isVideo ? icons.video : icons.link;
                     const linkAnchor = createElement('a', 'group inline-flex items-center text-sm font-medium text-i4-blue hover:text-blue-700 transition-colors', `${linkIcon} ${link.title} ${icons.arrowRight}`, { href: link.url, target: '_blank', rel: 'noopener noreferrer' });
                     cardFooter.appendChild(linkAnchor);
                 });
                 cardBody.appendChild(cardFooter);
            }

            itemDiv.appendChild(cardBody);
            agendaGrid.appendChild(itemDiv);
        });
        container.appendChild(agendaGrid);
    }

    function renderRegulatoryTable(container, data, title, hasYearColumn = false) {
        const tableTitle = createElement('h3', 'text-xl font-bold text-i4-dark-gray mb-4 mt-8', title);
        container.appendChild(tableTitle);

        const tableContainer = createElement('div', 'info-card overflow-x-auto mb-10');
        const table = createElement('table', 'styled-table w-full text-sm text-left text-i4-text-gray');
        const thead = createElement('thead', 'text-xs text-i4-text-gray uppercase bg-i4-light-gray');
        const tbody = createElement('tbody', 'bg-white divide-y divide-i4-border-gray');

        let headerHtml = `
            <tr>
                <th scope="col" class="w-20 px-6 py-4">Eixo Temático</th>
                <th scope="col" class="w-20 px-6 py-4">Código</th>
        `;
        if (hasYearColumn) {
            headerHtml += `<th scope="col" class="w-32 px-6 py-4 text-center">Ano Previsto</th>`;
        }
        headerHtml += `<th scope="col" class="px-6 py-4">Atividade Regulatória</th></tr>`;
        thead.innerHTML = headerHtml;
        table.appendChild(thead);

        let currentEixo = null;
        data.forEach(item => {
            const tr = createElement('tr', 'hover:bg-i4-light-gray');
            
            let eixoCell = '';
            if (item.eixo !== currentEixo) {
                const rowSpanCount = data.filter(d => d.eixo === item.eixo).length;
                eixoCell = `<td class="px-6 py-4 font-semibold text-i4-blue align-middle border-r border-i4-border-gray" rowspan="${rowSpanCount}">${item.eixo}</td>`;
                currentEixo = item.eixo;
            }

            let yearCell = hasYearColumn ? `<td class="px-6 py-4 whitespace-nowrap font-medium text-i4-dark-gray text-center">${item.ano || '-'}</td>` : '';
            
            tr.innerHTML = `
                ${eixoCell}
                <td class="px-6 py-4 font-semibold text-i4-dark-gray">${item.codigo}</td>
                ${yearCell}
                <td class="px-6 py-4">${item.atividade}</td>
            `;
            tbody.appendChild(tr);
        });

        table.appendChild(tbody);
        tableContainer.appendChild(table);
        container.appendChild(tableContainer);
    }

      footer.innerHTML = `© 2026 i4 Economic Regulation. Todos os direitos reservados.`;
      appContainer.appendChild(footer);

      const buttons = [pauta22RPOButton, consultasButton, agendaButton, imersaoButton];
      function setActiveButton(activeBtn) {
          buttons.forEach(btn => { btn.classList.remove('nav-button-active'); btn.classList.add('nav-button-inactive'); });
          activeBtn.classList.add('nav-button-active'); activeBtn.classList.remove('nav-button-inactive');
      }

      pauta22RPOButton.addEventListener('click', () => { setActiveButton(pauta22RPOButton); renderPageWithAnimation(renderPauta22RPOPage, contentContainer); });
      consultasButton.addEventListener('click', () => { setActiveButton(consultasButton); renderPageWithAnimation(renderConsultasPage, contentContainer); });
      agendaButton.addEventListener('click', () => { setActiveButton(agendaButton); renderPageWithAnimation(renderAgendaRegulatoriaPage, contentContainer); });
      imersaoButton.addEventListener('click', () => { setActiveButton(imersaoButton); renderPageWithAnimation(renderImersaoPage, contentContainer); });

      // Inicia na pauta da 22ª RPO
      setActiveButton(pauta22RPOButton);
      renderPageWithAnimation(renderPauta22RPOPage, contentContainer);
    }

    // Inicialização final do app
    document.addEventListener('DOMContentLoaded', renderApp);
  </script>
</body>
</html>
